name: Update exact-match results

on:
  push:
    branches:
      - "**"

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pushed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Calculate exact match and update README
        run: python test/evaluate_exact_match.py

      - name: Commit updated results
        run: |
          if git diff --quiet -- README.MD; then
            echo "README metrics are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.MD
          git commit -m "docs: update exact-match results"
          git push
