[project]
name = "multihop-rag-baseline"
version = "0.1.0"
description = "A reproducible LangChain and Qdrant baseline for MultiHop-RAG"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "langchain-core>=1.6.0",
    "langchain-openai==1.6.0",
    "openai==3.8.0",
    "langfuse==4.15.1",
    "langchain-huggingface>=1.0",
    "langchain-qdrant>=1.0",
    "langchain-text-splitters>=1.0",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "tiktoken>=0.7",
    "sentence-transformers>=3.0",
    "uvicorn>=0.30",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "jsonschema>=4.0", "ruff>=0.9"]
