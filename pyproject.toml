[project]
name = "multihop-rag-baseline"
version = "0.1.0"
description = "A reproducible LangChain and Qdrant baseline for MultiHop-RAG"
requires-python = ">=3.12"
dependencies = [
    "cerebras-cloud-sdk>=1.0",
    "fastapi>=0.115",
    "groq>=1.6.0",
    "langchain-core>=1.0",
    "langchain-huggingface>=1.0",
    "langchain-qdrant>=1.0",
    "langchain-text-splitters>=1.0",
    "python-dotenv>=1.0",
    "sentence-transformers>=3.0",
    "uvicorn>=0.30",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
